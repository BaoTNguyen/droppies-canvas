name: droppies_canvas
description: Infinite freehand canvas with Obsidian vault export.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

  # Stroke smoothing — same algorithm as Excalidraw
  perfect_freehand: ^2.0.0

  # Unique IDs for strokes and documents
  uuid: ^4.4.0

  # Default app storage path (Android internal storage)
  path_provider: ^2.1.3

  # Let user pick their Obsidian vault directory
  file_picker: ^8.1.2

  # Persist vault path and settings between launches
  shared_preferences: ^2.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
